<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px; box-sizing: border-box;
    background: linear-gradient(135deg, #070b14, #0a2a4d);
    color: #e6edf7; font-family: sans-serif;
  }
  .kicker { font-size: 28px; letter-spacing: 4px; text-transform: uppercase; color: #36c5f4; }
  h1 { font-size: 76px; line-height: 1.1; margin: 0; }
  footer { display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: #8b9ab3; }
  .badge { background: #1ba1e2; color: white; padding: 12px 28px; border-radius: 40px; font-weight: bold; }
</style>
</head>
<body>
  <div class="kicker">AngleSharp Blog</div>
  <h1 class="title">Title</h1>
  <footer>
    <span class="date">Date</span>
    <span class="badge">Tag</span>
  </footer>
</body>
</html>
