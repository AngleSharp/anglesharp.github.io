<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: Arial, sans-serif; color: #1f2937; }
    h1 { font-size: 28px; color: #0a6fd1; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.5; }
    .note { color: #6b7280; font-size: 14px; }
    #cta { text-align: center; }
    .button { background-color: #1ba1e2; color: white; padding: 12px 24px; text-decoration: none; }
    .column { width: 50%; }
    @media (max-width: 600px) {
      .column { width: 100%; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <h1>Your build is ready</h1>
  <p>AngleSharp 1.11 is out, with native AoT support across the ecosystem.</p>
  <div class="column"><p class="note">You get this email because you follow the project.</p></div>
  <p id="cta"><a class="button" href="https://anglesharp.github.io/">Read the release notes</a></p>
</body>
</html>
