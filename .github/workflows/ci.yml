name: CI

on:
  push:
    branches: [main]
  release:
    types:
      - created
  workflow_dispatch:
  schedule:
    # rebuild weekly to pick up documentation changes in the project repositories
    - cron: "0 4 * * 0"

jobs:
  deploy_www:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2026

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: v2026/package-lock.json
        registry-url: 'https://registry.npmjs.org'

    - name: Install Dependencies
      run: |
        npm ci

    - name: Fetch project docs
      run: |
        npm run fetch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Release
      run: |
        npm run build

    - name: Deploy with gh-pages
      run: |
        git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        npm run deploy -- -u "github-actions-bot <support+actions@github.com>"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
